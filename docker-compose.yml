services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: payguard-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=sqlite:///./payguard.db
      - FRONTEND_ORIGIN=*
    volumes:
      - ./backend/payguard.db:/app/payguard.db
      - ./backend/app/ml/saved_models:/app/app/ml/saved_models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: payguard-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001/api
    depends_on:
      - backend
